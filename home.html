
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>

    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>

<body class="min-h-screen w-full max-w-md lg:max-w-2xl xl:max-w-3xl bg-base-200 mx-auto overflow-x-hidden">


    <!-- Header -->
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">

        <section class="w-[92%] sm:w-11/12 mx-auto py-3 sm:py-4 flex justify-between items-center gap-2">

            <div class="left flex gap-1 sm:gap-2 items-center">

                <div class="logo w-12 sm:w-[60px] shrink-0">
                    <img src="assets/logo.png" alt="" class="w-full h-auto">
                </div>

                <div class="balance-info min-w-0">
                    <h2 class="text-xl sm:text-2xl md:text-3xl font-bold">
                        $ <span id="balance">45000</span>
                    </h2>

                    <p class="text-xs sm:text-sm md:text-base text-neutral/50 whitespace-nowrap">
                        Available Balance
                    </p>
                </div>

            </div>


            <div class="right shrink-0">

                <a href="/index.html"
                    class="btn btn-soft btn-sm sm:btn-md whitespace-nowrap text-xs sm:text-sm md:text-base">

                    <i class="fa-solid fa-right-from-bracket"
                        style="color: rgb(0, 106, 217);"></i>

                    <span>Logout</span>

                </a>

            </div>

        </section>

    </header>


    <!-- Welcome Section -->
    <section class="w-[92%] sm:w-11/12 mx-auto py-7 sm:py-9 md:py-10 space-y-2">

        <h2 class="text-2xl sm:text-3xl md:text-4xl font-bold">
            Welcome to Pay<span class="text-primary">oo</span>
        </h2>

        <p class="text-sm sm:text-base md:text-lg text-neutral/50 leading-relaxed">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. recusandae quos eos laudantium a fugiat dolores sed quas consectetur.
        </p>


        <!-- Buttons -->
        <div class="buttons grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3 md:gap-4 pt-2">

            <button onclick="showOnly('Add-money')"
                class="btn flex-col h-full min-h-24 sm:min-h-28 md:min-h-32 py-3 sm:py-4 btn-pimary btn-soft rounded-xl text-xs sm:text-sm md:text-base">

                <img src="assets/opt-1.png" alt="" class="w-9 sm:w-10 md:w-12 h-auto">

                <p>Add Money</p>

            </button>


            <button onclick="showOnly('Cashout')"
                class="btn flex-col h-full min-h-24 sm:min-h-28 md:min-h-32 py-3 sm:py-4 btn-pimary btn-soft rounded-xl text-xs sm:text-sm md:text-base">

                <img src="assets/opt-2.png" alt="" class="w-9 sm:w-10 md:w-12 h-auto">

                <p id="cashShow">Cashout</p>

            </button>


            <button onclick="showOnly('transferMoney')"
                class="btn flex-col h-full min-h-24 sm:min-h-28 md:min-h-32 py-3 sm:py-4 btn-pimary btn-soft rounded-xl text-xs sm:text-sm md:text-base">

                <img src="assets/opt-3.png" alt="" class="w-9 sm:w-10 md:w-12 h-auto">

                <p>Transfer Money</p>

            </button>


            <button onclick="showOnly('getBonus')"
                class="btn flex-col h-full min-h-24 sm:min-h-28 md:min-h-32 py-3 sm:py-4 btn-pimary btn-soft rounded-xl text-xs sm:text-sm md:text-base">

                <img src="assets/opt-4.png" alt="" class="w-9 sm:w-10 md:w-12 h-auto">

                <p>Get Bonus</p>

            </button>


            <button onclick="showOnly('paybill')"
                class="btn flex-col h-full min-h-24 sm:min-h-28 md:min-h-32 py-3 sm:py-4 btn-pimary btn-soft rounded-xl text-xs sm:text-sm md:text-base">

                <img src="assets/opt-5.png" alt="" class="w-9 sm:w-10 md:w-12 h-auto">

                <p>Pay Bill</p>

            </button>


            <button onclick="showOnly('history')"
                class="btn flex-col h-full min-h-24 sm:min-h-28 md:min-h-32 py-3 sm:py-4 btn-pimary btn-soft rounded-xl text-xs sm:text-sm md:text-base">

                <img src="assets/opt-6.png" alt="" class="w-9 sm:w-10 md:w-12 h-auto">

                <p>Transactions</p>

            </button>

        </div>

    </section>


    <!-- Add Money -->
    <section id="Add-money" class="mx-auto w-[92%] sm:w-11/12 mb-8 sm:mb-10 hidden">

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-5">
            Add Money
        </h2>

        <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

            <div class="card-body p-4 sm:p-5 md:p-6">

                <fieldset class="fieldset space-y-2 w-full">

                    <label class="label font-bold text-black text-sm sm:text-base">
                        Select Bank
                    </label>

                    <select id="add-money-bank"
                        class="select rounded-full bg-base-200 w-full text-sm sm:text-base">

                        <option disabled selected>Select a Bank</option>
                        <option value="DBBL">DBBL</option>
                        <option value="IFIC">IFIC</option>
                        <option value="BRAC">BRAC</option>

                    </select>


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Bank Account Number
                    </label>

                    <input value="12345678910"
                        id="add-money-Number"
                        maxlength="11"
                        minlength="11"
                        type="text"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter bank 11 number" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Amount to add
                    </label>

                    <input id="add-money-Amount"
                        maxlength="4"
                        type="number"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Add amount to withdraw" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Pin Number
                    </label>

                    <input id="add-money-Pin"
                        maxlength="4"
                        type="password"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter 4 Digit pin number" />


                    <button id="add-money-btn"
                        class="btn btn-primary mt-4 rounded-full w-full min-h-11 sm:min-h-12">
                        Add Money
                    </button>

                </fieldset>

            </div>

        </div>

    </section>


    <!-- Cashout -->
    <section id="Cashout" class="mx-auto w-[92%] sm:w-11/12 mb-8 sm:mb-10 hidden">

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-5">
            Cashout
        </h2>

        <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

            <div class="card-body p-4 sm:p-5 md:p-6">

                <fieldset class="fieldset space-y-2 w-full">

                    <label class="label font-bold text-black text-sm sm:text-base">
                        Agent Number
                    </label>

                    <input value="12345678910"
                        id="agent-Number"
                        maxlength="11"
                        minlength="11"
                        type="text"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter 11 digit number" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Amount
                    </label>

                    <input id="cashout-Amount"
                        maxlength="4"
                        type="number"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter amount to withdraw" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Pin Number
                    </label>

                    <input id="cashout-Pin"
                        maxlength="4"
                        type="password"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter 4 Digit pin number" />


                    <button id="cashout-btn"
                        class="btn btn-primary mt-4 rounded-full w-full min-h-11 sm:min-h-12">
                        Withdraw Taka
                    </button>

                </fieldset>

            </div>

        </div>

    </section>


    <!-- Transfer Money -->
    <section id="transferMoney" class="mx-auto w-[92%] sm:w-11/12 mb-8 sm:mb-10 hidden">

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-5">
            Transfer Money
        </h2>

        <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

            <div class="card-body p-4 sm:p-5 md:p-6">

                <fieldset class="fieldset space-y-2 w-full">

                    <label class="label font-bold text-black text-sm sm:text-base">
                        User Account Number
                    </label>

                    <input value="12345678910"
                        id="transfer-Number"
                        maxlength="11"
                        minlength="11"
                        type="text"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter 11 digit number" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Amount
                    </label>

                    <input id="transfer-Amount"
                        maxlength="4"
                        type="number"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter amount to withdraw" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Pin Number
                    </label>

                    <input id="transfer-Pin"
                        maxlength="4"
                        type="password"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter 4 Digit pin number" />


                    <button id="transfer-btn"
                        class="btn btn-primary mt-4 rounded-full w-full min-h-11 sm:min-h-12">
                        Withdraw Taka
                    </button>

                </fieldset>

            </div>

        </div>

    </section>


    <!-- Get Bonus -->
    <section id="getBonus" class="mx-auto w-[92%] sm:w-11/12 mb-8 sm:mb-10 hidden">

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-5">
            Get Bonus
        </h2>

        <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

            <div class="card-body p-4 sm:p-5 md:p-6">

                <fieldset class="fieldset space-y-2 w-full">

                    <label class="label font-bold text-black text-sm sm:text-base">
                        Enter Bonus Coupon
                    </label>

                    <input id="bonus-Number"
                        maxlength="8"
                        minlength="1"
                        type="text"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter your coupon" />


                    <button id="bonus-btn"
                        class="btn btn-primary mt-4 rounded-full w-full min-h-11 sm:min-h-12">
                        Get Bonus
                    </button>

                </fieldset>

            </div>

        </div>

    </section>


    <!-- Pay Bill -->
    <section id="paybill" class="mx-auto w-[92%] sm:w-11/12 mb-8 sm:mb-10 hidden">

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-5">
            Pay Bill
        </h2>

        <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

            <div class="card-body p-4 sm:p-5 md:p-6">

                <fieldset class="fieldset space-y-2 w-full">

                    <label class="label font-bold text-black text-sm sm:text-base">
                        Select to Pay
                    </label>

                    <select id="pay-bank"
                        class="select rounded-full bg-base-200 w-full text-sm sm:text-base">

                        <option disabled selected>Select a Bank</option>
                        <option value="DBBL">DBBL</option>
                        <option value="IFIC">IFIC</option>
                        <option value="BRAC">BRAC</option>

                    </select>


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Biller Account Number
                    </label>

                    <input value="12345678910"
                        id="biller-Number"
                        maxlength="11"
                        minlength="11"
                        type="text"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter account number" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Amount to pay
                    </label>

                    <input id="biller-Amount"
                        maxlength="4"
                        type="number"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Add amount to pay" />


                    <label class="label font-bold text-black text-sm sm:text-base">
                        Pin Number
                    </label>

                    <input id="biller-Pin"
                        maxlength="4"
                        type="password"
                        class="input rounded-full bg-base-200 w-full text-sm sm:text-base"
                        placeholder="Enter 4 Digit pin number" />


                    <button id="bill-btn"
                        class="btn btn-primary mt-4 rounded-full w-full min-h-11 sm:min-h-12">
                        Pay now
                    </button>

                </fieldset>

            </div>

        </div>

    </section>


    <!-- Transaction History -->
    <section id="history" class="mx-auto w-[92%] sm:w-11/12 mb-8 sm:mb-10 hidden">

        <h2 class="text-xl sm:text-2xl font-bold mb-4 sm:mb-5">
            Transactions History
        </h2>

        <div class="space-y-5 w-full" id="history-container">

        </div>

    </section>


    <script src="script/machine.js"></script>
    <script src="script/get.js"></script>
    <script src="script/payBill.js"></script>
    <script src="script/transferMoney.js"></script>
    <script src="script/addMoney.js"></script>
    <script src="script/cashout.js"></script>

</body>

</html>
