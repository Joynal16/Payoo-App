<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>

    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

   <style>
     *{
        font-family: "Outfit", sans-serif;
     }
   </style>

</head>






<body class="min-h-screen max-w-md bg-base-200 mx-auto">

  



<header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">

    <section class="w-11/12 mx-auto py-3 flex justify-between items-center">

        <div class="left flex gap-1">
            <div class="logo w-[60px]">
                <img src="assets/logo.png" alt="">
            </div>

        <div class="balance-info">
            <h2 class="text-2xl font-bold">$ <span id="balance">45000</span></h2>
            <p class="text-neutral/50">Available Balance</p>
        </div>

        </div>
      

        <div class="right">
            <a href="/index.html" class="btn btn-soft"><i class="fa-solid fa-right-from-bracket" style="color: rgb(0, 106, 217);"></i> Logout</a>
        </div>

    </section>


</header>






<section class="w-11/12 mx-auto py-10 space-y-2">
    <h2 class="text-3xl font-bold">Welcome to Pay<span class="text-primary">oo</span></h2>
      <p class="text-neutral/50">Lorem ipsum dolor sit amet consectetur, adipisicing elit. recusandae quos eos laudantium a fugiat dolores sed quas consectetur.</p>

      <div class="buttons grid grid-cols-3 gap-3">
        <button onclick="showOnly('Add-money')" class="btn flex-col h-full py-4 btn-pimary btn-soft rounded-xl">
            <img src="assets/opt-1.png" alt="">
            <p>Add Money</p>
        </button>
        <button onclick="showOnly('Cashout')" class="btn flex-col h-full py-4 btn-pimary btn-soft rounded-xl">
            <img src="assets/opt-2.png" alt="">
            <p id="cashShow">Cashout</p>
        </button>
        <button onclick="showOnly('transferMoney')" class="btn flex-col h-full py-4 btn-pimary btn-soft rounded-xl ">
            <img src="assets/opt-3.png" alt="">
            <p>Transfer Money</p>
        </button>
        <button onclick="showOnly('getBonus')" class="btn flex-col h-full py-4 btn-pimary btn-soft rounded-xl">
            <img src="assets/opt-4.png" alt="">
            <p>Get Bonus</p>
        </button>
        <button onclick="showOnly('paybill')" class="btn flex-col h-full py-4 btn-pimary btn-soft rounded-xl">
            <img src="assets/opt-5.png" alt="">
            <p>Pay Bill</p>
        </button>
        <button onclick="showOnly('history')" class="btn flex-col h-full py-4 btn-pimary btn-soft rounded-xl">
            <img src="assets/opt-6.png" alt="">
            <p>Transactions</p>
        </button>
      </div>
</section>




<section id="Add-money" class="mx-auto w-11/12 mb-10 hidden">
    <h2 class="text-xl font-bold mb-5">Add Money</h2>
     <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

      <div class="card-body">

        <fieldset class="fieldset space-y-2">

            <label class="label font-bold text-black">Select Bank</label>
            <select id="add-money-bank" class="select rounded-full bg-base-200">
                <option disabled selected>Select a Bank</option>
                <option value="DBBL">DBBL</option>
                <option value="IFIC">IFIC</option>
                <option value="BRAC">BRAC</option>
            </select>

          <label class="label font-bold text-black">Bank Account Number</label>
          <input value="12345678910" id="add-money-Number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200" placeholder="Enter bank 11 number" />
          
          <label  class="label font-bold text-black">Amount to add</label>
          <input  id="add-money-Amount" maxlength="4" type="number" class="input rounded-full bg-base-200" placeholder="Add amount to withdraw" />


          <label  class="label font-bold text-black">Pin Number</label>
          <input  id="add-money-Pin" maxlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit pin number" />
      
          <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full w-[325px]">Add Money</button>

        </fieldset>

      </div>

    </div>
</section>






<section id="Cashout" class="mx-auto w-11/12 mb-10 hidden">

    <h2 class="text-xl font-bold mb-5">Cashout</h2>
    <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

      <div class="card-body">

        <fieldset class="fieldset space-y-2">

          <label class="label font-bold text-black">Agent Number</label>
          <input value="12345678910" id="agent-Number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200" placeholder="Enter 11 digit number" />
          
          <label  class="label font-bold text-black">Amount</label>
          <input  id="cashout-Amount" maxlength="4" type="number" class="input rounded-full bg-base-200" placeholder="Enter amount to withdraw" />


          <label  class="label font-bold text-black">Pin Number</label>
          <input  id="cashout-Pin" maxlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit pin number" />
      
          <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full w-[325px]">Withdraw Taka</button>

        </fieldset>

      </div>

    </div>

</section>






<section id="transferMoney" class="mx-auto w-11/12 mb-10 hidden">
    <h2 class="text-xl font-bold mb-5">Transfer Money</h2>
    <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

      <div class="card-body">

        <fieldset class="fieldset space-y-2">

          <label class="label font-bold text-black">User Account Number</label>
          <input value="12345678910" id="transfer-Number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200" placeholder="Enter 11 digit number" />
          
          <label  class="label font-bold text-black">Amount</label>
          <input  id="transfer-Amount" maxlength="4" type="number" class="input rounded-full bg-base-200" placeholder="Enter amount to withdraw" />


          <label  class="label font-bold text-black">Pin Number</label>
          <input  id="transfer-Pin" maxlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit pin number" />
      
          <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full w-[325px]">Withdraw Taka</button>

        </fieldset>

      </div>

    </div>
</section>




<section id="getBonus"  class="mx-auto w-11/12 mb-10 hidden">
    <h2 class="text-xl font-bold mb-5">Get Bonus</h2>
       <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

      <div class="card-body">

        <fieldset class="fieldset space-y-2">

          <label class="label font-bold text-black">Enter Bonus Coupon</label>
          <input  id="bonus-Number" maxlength="8" minlength="1" type="text" class="input rounded-full bg-base-200" placeholder="Enter your coupon" />

            <button id="bonus-btn" class="btn btn-primary mt-4 rounded-full w-[325px]">Get Bonus</button>
          
        </fieldset>

      </div>

    </div>

</section>





<section id="paybill"  class="mx-auto w-11/12 mb-10 hidden">
    <h2 class="text-xl font-bold mb-5"> Pay Bill</h2>
     <div class="card bg-base-100 w-full shadow-xl rounded-2xl">

      <div class="card-body">

        <fieldset class="fieldset space-y-2">

            <label class="label font-bold text-black">Select to Pay</label>
            <select id="pay-bank" class="select rounded-full bg-base-200">
                <option disabled selected>Select a Bank</option>
                <option value="DBBL">DBBL</option>
                <option value="IFIC">IFIC</option>
                <option value="BRAC">BRAC</option>
            </select>

          <label class="label font-bold text-black">Biller Account Number</label>
          <input value="12345678910" id="biller-Number" maxlength="11" minlength="11" type="text" class="input rounded-full bg-base-200" placeholder="Enter account number" />
          
          <label  class="label font-bold text-black">Amount to pay</label>
          <input  id="biller-Amount" maxlength="4" type="number" class="input rounded-full bg-base-200" placeholder="Add amount to pay" />


          <label  class="label font-bold text-black">Pin Number</label>
          <input  id="biller-Pin" maxlength="4" type="password" class="input rounded-full bg-base-200" placeholder="Enter 4 Digit pin number" />
      
          <button id="bill-btn" class="btn btn-primary mt-4 rounded-full w-[325px]">Pay now</button>

        </fieldset>

      </div>

    </div>
</section>






<section id="history" class="mx-auto w-11/12 mb-10 hidden">
      <h2 class="text-xl font-bold mb-5">Transactions History</h2>
      <div class="space-y-5" id="history-container">

      </div>
</section>





<script src="script/machine.js"></script>
<script src="script/get.js"></script>
<script src="script/payBill.js"></script>
<script src="script/transferMoney.js"></script>
<script src="script/addMoney.js"></script>
<script src="script/cashout.js"></script>

</body>
</html>
